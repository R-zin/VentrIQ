name: VentriQ CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style Check (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check src scripts tests

      - name: Run Ruff Format Verification
        run: uv run ruff format --check src scripts tests

  type-check:
    name: Static Type Analysis (Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Mypy Type Checker
        run: uv run mypy src

  unit-and-stress-tests:
    name: Unit, Stress & Coverage Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Full Test Suite with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Coverage XML Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml

  pipeline-integration:
    name: Clinical Pipeline Integration (Phases 1 - 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Phase 1 Dataset Exploration & Verification
        run: uv run python scripts/explore_dataset.py --report-dir reports/

      - name: Run Phase 2 Signal Preprocessing & Quality Audit
        run: uv run python scripts/preprocess_ecg.py --report-dir reports/

      - name: Run Phase 3 Dataset Manifest & Traceability Audit
        run: uv run python scripts/build_dataset_manifest.py --report-dir reports/

      - name: Run Phase 4 ECG Waveform-to-Image Paper Renderer
        run: uv run python scripts/generate_ecg_images.py --report-dir reports/ --num-samples 5

      - name: Run Phase 5 Smartphone Vision Simulation & Rectification
        run: uv run python scripts/validate_pipeline.py --report-dir reports/ --num-samples 5

      - name: Verify Pipeline Artifacts Exist
        run: |
          test -f reports/phase1_exploration_report.md
          test -f reports/figures/lvef_distribution.png
          test -f reports/figures/split_distribution.png
          test -f reports/figures/representative_ecgs.png
          test -f reports/phase2_quality_report.md
          test -f reports/figures/filtering_comparison.png
          test -f reports/figures/lead_quality_distribution.png
          test -f data/processed/quality_summary.json
          test -f reports/dataset_manifest.json
          test -f reports/phase3_manifest_report.md
          test -f reports/phase4_rendering_report.md
          test -f reports/figures/rendered_ecg_sample.png
          test -f data/synthetic/image_manifest.csv
          test -f reports/phase5_vision_report.md
          test -f reports/figures/vision_pipeline_stages.png
          echo "All Phase 1, Phase 2, Phase 3, Phase 4, and Phase 5 reports, figures, and data artifacts successfully verified!"

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-verification-artifacts
          path: |
            reports/
            data/processed/quality_summary.json
            data/synthetic/image_manifest.csv

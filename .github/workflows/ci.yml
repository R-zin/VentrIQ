name: VentriQ CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Verify Pipeline (Phases 1 & 2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Unit Tests (Phases 1 & 2)
        run: uv run pytest tests/ -v

      - name: Run Phase 1 Dataset Exploration & Verification
        run: uv run python scripts/explore_dataset.py --report-dir reports/

      - name: Run Phase 2 Signal Preprocessing & Quality Audit
        run: uv run python scripts/preprocess_ecg.py --report-dir reports/

      - name: Verify Pipeline Artifacts Exist
        run: |
          test -f reports/phase1_exploration_report.md
          test -f reports/figures/lvef_distribution.png
          test -f reports/figures/split_distribution.png
          test -f reports/figures/representative_ecgs.png
          test -f reports/phase2_quality_report.md
          test -f reports/figures/filtering_comparison.png
          test -f reports/figures/lead_quality_distribution.png
          test -f data/processed/quality_summary.json
          echo "All Phase 1 and Phase 2 reports, figures, and data artifacts successfully verified!"

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-verification-artifacts
          path: |
            reports/
            data/processed/quality_summary.json

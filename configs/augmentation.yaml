# VentriQ Phase 5: Smartphone Capture & Photograph Distortion Configuration
# Simulates physical real-world camera artifacts for edge vision model training

presets:
  # Clean / Baseline (no distortion, ground-truth reference)
  clean:
    enable_perspective: false
    enable_page_curl: false
    enable_illumination: false
    enable_shadows: false
    enable_glare: false
    enable_blur: false
    enable_noise: false
    enable_jpeg: false

  # Mild: typical well-lit clinical desk photo with slight hand tilt
  mild:
    enable_perspective: true
    yaw_deg_range: [-6.0, 6.0]
    pitch_deg_range: [-6.0, 6.0]
    roll_deg_range: [-3.0, 3.0]
    enable_page_curl: true
    curl_amplitude_range: [1.0, 4.0]
    enable_illumination: true
    vignette_strength_range: [0.05, 0.18]
    enable_shadows: true
    shadow_intensity_range: [0.2, 0.4]
    enable_glare: false
    enable_blur: true
    blur_radius_range: [0.3, 0.8]
    enable_noise: true
    noise_sigma_range: [1.0, 3.0]
    enable_jpeg: true
    jpeg_quality_range: [70, 85]

  # Moderate: standard handheld smartphone photo with moderate angle, cast shadow & penumbra
  moderate:
    enable_perspective: true
    yaw_deg_range: [-14.0, 14.0]
    pitch_deg_range: [-14.0, 14.0]
    roll_deg_range: [-7.0, 7.0]
    enable_page_curl: true
    curl_amplitude_range: [3.0, 8.0]
    enable_illumination: true
    vignette_strength_range: [0.15, 0.35]
    enable_shadows: true
    shadow_intensity_range: [0.35, 0.65]
    enable_glare: true
    glare_intensity_range: [0.2, 0.5]
    enable_blur: true
    blur_radius_range: [0.5, 1.5]
    enable_noise: true
    noise_sigma_range: [2.0, 5.0]
    enable_jpeg: true
    jpeg_quality_range: [50, 75]

  # Severe: challenging point-of-care capture (high tilt, strong shadows, camera shake, glare)
  severe:
    enable_perspective: true
    yaw_deg_range: [-20.0, 20.0]
    pitch_deg_range: [-20.0, 20.0]
    roll_deg_range: [-12.0, 12.0]
    enable_page_curl: true
    curl_amplitude_range: [6.0, 14.0]
    enable_illumination: true
    vignette_strength_range: [0.25, 0.50]
    enable_shadows: true
    shadow_intensity_range: [0.50, 0.75]
    enable_glare: true
    glare_intensity_range: [0.4, 0.8]
    enable_blur: true
    blur_radius_range: [1.0, 2.5]
    enable_noise: true
    noise_sigma_range: [4.0, 8.0]
    enable_jpeg: true
    jpeg_quality_range: [35, 60]

default_preset: "moderate"

background:
  # Surface background behind the photographed ECG paper (e.g. clinic desk/countertop)
  color: "#262626"   # Dark charcoal clinic desk
  pad_margin_factor: 0.15 # Padding ratio around the warped document

# VentriQ Phase 4: ECG Waveform-to-Image Paper Rendering Configuration
# Standard 12-lead ECG Paper Geometry, Cardiology Standards, and Appearance

paper:
  # Resolution in Dots Per Inch (DPI).
  # 150 DPI provides optimal fidelity-to-storage balance (~1654x1122 px).
  # 200 DPI or 300 DPI can be used for ultra-high-resolution print simulations.
  dpi: 150

  # Standard Cardiology Conventions
  paper_speed_mm_s: 25.0    # 25 mm/s (1 mm = 0.04 s = 40 ms; 5 mm = 0.20 s = 200 ms)
  voltage_gain_mm_mv: 10.0  # 10 mm/mV (1 mm = 0.1 mV; 5 mm = 0.5 mV; 10 mm = 1.0 mV)

  # Physical Paper Dimensions (in millimeters)
  # Standard landscape format (280 mm x 190 mm)
  width_mm: 280.0
  height_mm: 190.0
  margin_left_mm: 12.0
  margin_right_mm: 12.0
  margin_top_mm: 15.0
  margin_bottom_mm: 15.0

layout:
  # Format options: "3x4_1r" (standard 3x4 + rhythm strip), "3x4", "12x1", "6x2"
  format: "3x4_1r"
  rhythm_lead: "II"
  row_height_mm: 38.0

signal:
  # Sampling parameters matching EchoNext dataset specifications
  sampling_rate_hz: 250
  duration_sec: 10.0
  num_leads: 12

  # Amplitude scaling adaptation for EchoNext:
  # EchoNext waveforms are z-score standardized.
  # 6.0 mm per z-score unit maps +/- 2.5 SD deflections safely within 38 mm row heights.
  input_units: "zscore"  # "zscore" or "mv"
  amplitude_scale_mm_per_unit: 6.0

trace:
  color: "#111827"  # Dark slate charcoal
  line_width_px: 1.3
  anti_aliased: true
  supersample: 1    # 1 for fast direct drawing, 2 for supersampled anti-aliasing

grid:
  show_grid: true
  style: "standard_pink"  # "standard_pink", "classic_red", "subtle_gray", "clinical_green", "no_grid"
  minor_grid_mm: 1.0
  major_grid_mm: 5.0
  minor_color: "#fed7d7"  # Light pink minor grid line (1 mm)
  major_color: "#f87171"  # Medium pink/red major grid line (5 mm)
  background_color: "#ffffff"  # Clean medical paper white
  minor_line_width_px: 0.6
  major_line_width_px: 1.2

calibration:
  show_pulse: true
  pulse_height_mv: 1.0   # Standard 1.0 mV step pulse (10 mm)
  pulse_width_sec: 0.2   # Standard 0.2 s width (5 mm = 1 large box)
  lead_in_sec: 0.08      # 2 mm baseline lead-in
  lead_out_sec: 0.08     # 2 mm baseline lead-out
  rows_to_display: [0, 1, 2, 3]

typography:
  show_lead_labels: true
  label_font_size_pt: 9
  label_color: "#1f2937"
  show_header: true
  show_footer: true

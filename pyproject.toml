[project]
name = "ventriq"
version = "0.1.0"
description = "Phased ECG Preprocessing Pipeline for LVEF Estimation and Structural Heart Disease Detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
